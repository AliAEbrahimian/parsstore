name: Bug report
description: Report an error or unexpected behaviour on the site
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to improve this project.
        Please search the existing issues before opening a new one.

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What happened, and what did you expect to happen?
      placeholder: Submitting the inquiry form shows an error instead of a success message.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the home page
        2. Fill in the form
        3. Click "Send inquiry"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Python and Django versions
      placeholder: Python 3.13.5 - Django 5.2.4
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / operating system
      placeholder: Chrome 140 - Windows 11
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error or log output
      description: Paste browser console or terminal output here (remove sensitive data).
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I have searched the existing issues.
          required: true
        - label: This report contains no keys or other sensitive information.
          required: true
